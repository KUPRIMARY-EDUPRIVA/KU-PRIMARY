    <!-- ✅ OFFLINE-FIRST SERVICE WORKER REGISTRATION -->
    <!-- ============================================ -->
    <script>
        // Register Service Worker for offline support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(function(registration) {
                        console.log('✅ Service Worker registered successfully:', registration.scope);
                        
                        // Check for updates
                        registration.addEventListener('updatefound', function() {
                            const newWorker = registration.installing;
                            newWorker.addEventListener('statechange', function() {
                                if (newWorker.state === 'activated') {
                                    console.log('✅ Service Worker updated');
                                }
                            });
                        });
                    })
                    .catch(function(error) {
                        console.log('❌ Service Worker registration failed:', error);
                    });
            });
        }

        // Register beforeinstallprompt for PWA
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', function(e) {
            // Prevent Chrome 67 and earlier from automatically showing the prompt
            e.preventDefault();
            // Stash the event so it can be triggered later
            deferredPrompt = e;
            console.log('✅ PWA installation prompt available');
        });

        // Handle app install
        window.addEventListener('appinstalled', function() {
            console.log('✅ PWA installed successfully');
            // You can track this event for analytics
        });

        // Check if running in standalone mode (PWA)
        if (window.matchMedia('(display-mode: standalone)').matches) {
            console.log('✅ Running as standalone PWA');
            document.documentElement.classList.add('pwa-mode');
        }

        // Network status detection
        window.addEventListener('online', function() {
            console.log('✅ Back online');
            document.documentElement.classList.remove('offline');
            document.documentElement.classList.add('online');
        });

        window.addEventListener('offline', function() {
            console.log('❌ Offline');
            document.documentElement.classList.remove('online');
            document.documentElement.classList.add('offline');
        });

        // Initial network status
        if (navigator.onLine) {
            document.documentElement.classList.add('online');
        } else {
            document.documentElement.classList.add('offline');
        }

        // Handle indexDB errors gracefully
        window.addEventListener('unhandledrejection', function(event) {
            if (event.reason && event.reason.name === 'NotFoundError') {
                console.log('⚠️ IndexedDB store not found, will create on next init');
                event.preventDefault();
            }
        });
    </script>
