# netlify.toml
# EduPriva — production configuration

# ============================================================
# Build
# ============================================================
[build]
  publish = "build"
  command = "CI=false npm run build"
  # Modern key (was `functions = "netlify/functions"` in older CLI).
  # @netlify/build 24+ prefers `functions-directory`.
  functions-directory = "netlify/functions"
  # Where bundled functions land at deploy time. Default is fine; the
  # explicit setting helps the CLI when running `netlify dev` locally.
  edge_functions = "netlify/edge-functions"

[build.environment]
  NODE_VERSION = "18"
  # Prevents react-scripts from running its post-build analysis when
  # the deploy target is set to production by Netlify.
  CI = "false"

  # ------------------------------------------------------------
  # Secrets scanning (Option 2)
  # ------------------------------------------------------------
  # `.env-example` ships with illustrative values that happen to match
  # the real Gmail credentials configured in the Netlify UI, which trips
  # Netlify's post-build secret scanner and fails the deploy even though
  # the React build itself succeeded.
  #
  # Skip the example file plus the keys it exposes. The real credentials
  # still live ONLY in the Netlify UI env vars and are never sent to the
  # client bundle.
  #
  # To harden this later, replace the values in `.env-example` with
  # placeholders and remove SECRETS_SCAN_OMIT_PATHS / _KEYS entirely.
  SECRETS_SCAN_OMIT_PATHS = ".env-example"
  SECRETS_SCAN_OMIT_KEYS  = "GMAIL_USER,GMAIL_APP_PASSWORD,TEACHER_WELCOME_FROM,TEACHER_WELCOME_REPLY_TO"

# ============================================================
# Scheduled functions
# ============================================================
# Netlify scheduled functions: the block name must EXACTLY match the
# function filename (without .js).
#
# Free plan: schedules are limited to one run per day and require a
# manual trigger via `netlify functions:invoke` to seed.
# Pro plan: cron expressions run at full fidelity — every 15 min below.
#
# If you are on Free, change the schedule to "0 3 * * *" (daily at 03:00 UTC).
[functions.mpesa-timeout-sweep]
  schedule = "*/15 * * * *"

# ============================================================
# Function bundling
# ============================================================
# Only bundle the modules each function requires. This dramatically
# shrinks the deploy and cold-start time, especially for functions that
# only need a couple of npm packages.
#
# `external_node_modules` tells esbuild NOT to bundle these packages
# into each function. Instead, they are installed once by Netlify at
# deploy time and required at runtime from node_modules.
#
# Why `firebase-admin` is external:
#   The SDK uses dynamic requires, optional native dependencies (gRPC),
#   and Google Cloud submodules that esbuild cannot tree-shake reliably.
#   Bundling it causes the runtime to receive a partial module where
#   `admin.credential`, `admin.firestore`, or `FieldValue` are undefined —
#   producing the "Cannot read properties of undefined (reading 'cert')"
#   error. Marking it external lets Node resolve the full package
#   at runtime.
[functions]
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin", "nodemailer", "pdfkit"]

# ============================================================
# Redirects
# ============================================================
# API routes → Netlify Functions.
# Register the M-Pesa callback on the Daraja portal as:
#     https://<your-site>/api/mpesa-callback
# not the raw /.netlify/functions/mpesa-callback URL.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Do NOT cache function responses — payments, callbacks, and auth
# endpoints must always hit a fresh instance.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

# Explicitly allow static assets. `force = true` means "if the file
# isn't there, 404 — don't fall through to the SPA."
[[redirects]]
  from = "/static/*"
  to = "/static/:splat"
  status = 200
  force = true

# SPA fallback — everything else goes to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ============================================================
# Global security headers
# ============================================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options            = "DENY"
    X-XSS-Protection           = "1; mode=block"
    X-Content-Type-Options     = "nosniff"
    Referrer-Policy            = "strict-origin-when-cross-origin"
    Permissions-Policy         = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security  = "max-age=31536000; includeSubDomains; preload"

# ============================================================
# Scheduled function environment
# ============================================================
# `mpesa-timeout-sweep` needs the same Firebase Admin credentials
# that `mpesa-callback` uses. Set these in the Netlify UI:
#
#   FIREBASE_PROJECT_ID
#   FIREBASE_CLIENT_EMAIL
#   FIREBASE_PRIVATE_KEY       (with literal \n newlines)
#
# SMS delivery functions also use these Netlify environment variables:
#
#   AT_USERNAME
#   AT_API_KEY
#   AT_SENDER_ID                (optional approved sender ID)
#
# And for the callback auth (once you enable it):
#
#   MPESA_ALLOWED_IPS
#   MPESA_CALLBACK_USER
#   MPESA_CALLBACK_PASS
